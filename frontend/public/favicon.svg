<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded background, same colour as the page -->
  <rect width="32" height="32" rx="7" fill="#0b0f19" />

  <!-- Turbine in the blue accent colour. The blades are turned slightly so
       none points straight up, which keeps it from looking like an airplane. -->
  <g fill="#3b82f6">
    <!-- Tapered tower -->
    <polygon points="15,15 17,15 18.2,28 13.8,28" />
    <!-- Hub -->
    <circle cx="16" cy="13" r="2" />
  </g>
  <g stroke="#3b82f6" stroke-width="2.2" stroke-linecap="round" fill="none">
    <!-- Three blades, 120 degrees apart -->
    <line x1="16" y1="13" x2="12.2" y2="4.8" />
    <line x1="16" y1="13" x2="25" y2="13.8" />
    <line x1="16" y1="13" x2="10.8" y2="20.4" />
  </g>
</svg>
