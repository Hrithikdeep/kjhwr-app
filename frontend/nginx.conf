server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # The files in /assets have a hash in their name (like index-d7gJ3Xfl.js),
    # so a changed file always gets a new name and can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else: serve the file if it exists, otherwise index.html.
    # This stops a refresh on a deep link from giving a 404 if routes are added later.
    # index.html is never cached, so a new build is picked up straight away.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
